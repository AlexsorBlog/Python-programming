name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Встановити uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Зібрати оточення
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest із покриттям
        run: uv run pytest --cov=findex --cov-report=term

      - name: Зібрати wheel
        run: uv build

      - name: Перевірити, що CLI працює з wheel
        run: uvx --from dist/*.whl findex --help

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати образ
        run: docker build -t findex .

      - name: Запустити контейнер і дочекатися /health
        run: |
          docker run -d --name findex -p 8000:8000 findex
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs findex
          exit 1

      - name: Перевірити пошук і що процес не root
        run: |
          curl -fs "http://127.0.0.1:8000/search?q=spain&k=3"
          test "$(docker exec findex id -u)" != "0"
