name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Встановити uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Зібрати оточення
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest із покриттям
        run: uv run pytest --cov=findex --cov-report=term

      - name: Зібрати wheel
        run: uv build

      - name: Перевірити, що CLI працює з wheel
        run: uvx --from dist/*.whl findex --help
